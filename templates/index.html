<!DOCTYPE html>
<html>

<head>

    <title>AI Career Assistant</title>

    <style>

        body{
            font-family: Arial;
            background: linear-gradient(to right, #dfe9f3, #ffffff);
            text-align:center;
            margin-top:100px;
        }

        .box{
            background:white;
            width:450px;
            margin:auto;
            padding:40px;
            border-radius:15px;
            box-shadow:0px 0px 15px gray;
        }

        h1{
            color:#007bff;
        }

        input{
            margin-top:20px;
        }

        button{
            background:#007bff;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:5px;
            margin-top:20px;
            cursor:pointer;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>AI Career Assistant</h1>

    <p>Upload your resume PDF</p>

    <form
        action="/upload"
        method="POST"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="resume"
            required
        >

        <br>

        <button type="submit">
            Analyze Resume
        </button>

    </form>

</div>

</body>

</html>
